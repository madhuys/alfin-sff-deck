<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALFIN · Intelligence from the room · SFF 2026</title>
<style>
html,body{margin:0;height:100%;background:#08090B;overflow:hidden;font-family:Arial,sans-serif}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .35s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img,.slide > video{width:100%;height:100%;display:block;object-fit:contain;background:#08090B}
a.hot{position:absolute;display:block}
#bar{position:fixed;bottom:10px;right:16px;color:#8E959F;font-size:12px;letter-spacing:.15em;opacity:.6}
#hint{position:fixed;bottom:10px;left:16px;color:#8E959F;font-size:12px;opacity:.6;transition:opacity 1s}
</style></head><body>
<div id="stage"><div id="frame"></div></div>
<div id="hint">→ / ← or click to change slides · F for full screen</div>
<div id="bar"></div>
<script>
const N=12, frame=document.getElementById('frame'), slides=[];
for(let i=1;i<=N;i++){
  const d=document.createElement('div'); d.className='slide';
  if(i===2){ d.innerHTML='<video src="clip.mp4" playsinline preload="auto" poster="slides/2.jpg"></video>'; }
  else d.innerHTML='<img src="slides/'+i+'.jpg" alt="Slide '+i+'">';
  if(i===11){ const a=document.createElement('a'); a.className='hot'; a.href='https://gftn.co/alfin/prove-before-you-deploy'; a.target='_blank';
    Object.assign(a.style,{left:'6%',top:'63.2%',width:'88%',height:'11.7%'}); a.onclick=e=>e.stopPropagation(); d.appendChild(a); }
  if(i===12){ d.insertAdjacentHTML('beforeend','<video class="robot" src="robot.mp4" muted loop autoplay playsinline style="position:absolute;left:79.92%;top:30.8%;width:14.17%;height:46.27%;object-fit:cover"></video>'); }
  frame.appendChild(d); slides.push(d);
}
let cur=Math.min(N,Math.max(1,parseInt(location.hash.slice(1))||1));
function show(n){
  cur=Math.min(N,Math.max(1,n));
  slides.forEach((s,i)=>s.classList.toggle('on',i===cur-1));
  const v=slides[1].querySelector('video');
  if(cur===2){ v.currentTime=0; v.play().catch(()=>{}); } else v.pause();
  document.getElementById('bar').textContent=cur+' / '+N;
  history.replaceState(null,'','#'+cur);
}
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter','ArrowDown'].includes(e.key)){e.preventDefault();show(cur+1);}
  else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(e.key)){e.preventDefault();show(cur-1);}
  else if(e.key==='Home')show(1); else if(e.key==='End')show(N);
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
document.addEventListener('click',e=>{ show(e.clientX>innerWidth/3?cur+1:cur-1); });
let tx=null; document.addEventListener('touchstart',e=>tx=e.touches[0].clientX);
document.addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40)show(dx<0?cur+1:cur-1); tx=null; });
setTimeout(()=>document.getElementById('hint').style.opacity=0,4000);
show(cur);
</script></body></html>
